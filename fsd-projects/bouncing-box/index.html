<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Bouncing Box</title>
  <script src="jquery.min.js"></script>
  <!-- FONTS EMBED BELOW -->
 
  <!-- FONTS ENBED ABOVE -->
  <style>
    /* FONTS EMBED BELOW */
    
    /* FONTS EMBED ABOVE */
    .box {
      background-image: url("imagesB/cinnaPlane.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      width: 70px;
      height: 70px;
      font-size: 300%;
      text-align: center;
      user-select: none;
      display: block;
      position: absolute;
      top: 100px;
      /* Change me! */
      left: 0px;
    }
    .board {
      height: 100vh;
      background-color: rgb(169, 235, 255);
    }
    .scoreBoard {
      height: 100px;
      width: 200px;
      left: 5px;
      top: 5px;
      background-image: url("imagesB/scoreBoard.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      color: rgb(0, 175, 219);
      font-size: 30px;
      place-content: center;
      text-align: center;
      margin: 5;
      position: fixed;
      /* padding: 15px; */
    }
    #reset {
      height: 100px;
      width: 100px;
      background-image: url("imagesB/resetButton.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      right: 5px;
      top: 5px;
      position: fixed;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgb(0, 0, 0);
      background-color: rgba(0, 0, 0, 0.4);
    }

    .modalContent {
      background-color: rgb(164, 255, 255);
      color: rgb(0, 173, 241);
      margin: 15% auto;
      text-align: center;
      padding: 20px;
      border: 1px solid;
      border-color: white;
      width: 80%;
    }

    .closeAndReset {
      color: white;
      float: right;
      font-size: 28px;
      font-weight: bold;
    }

    .closeAndReset:hover,
    .closeAndReset:focus {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
  <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
</head>

<body class="board">
  <!-- HTML for the box -->
  <div class="box"></div>
  <div class="scoreBoard">0</div>
  <div id=reset></div>

  <!-- Modal Popups: https://www.w3schools.com/howto/howto_css_modals.asp -->

  <div id="endGameModal" class="modal" class="caveat">
    <div class="modalContent">
      <span class="closeAndReset">&times;</span>
      <h2 id="endGameMessage">error</h2>
    </div>
  </div>

  <script>
    (function () {
      "use strict";
      /* global jQuery */

      /////////////////////////// ///////////////////////////////////////
      /////////////////// SETUP DO NOT DELETE //////////////////////////
      //////////////////////////////////////////////////////////////////

      var box = jQuery(".box"); // reference to the HTML .box element
      var scoreBoard = jQuery(".scoreBoard")
      var board = jQuery(".board"); // reference to the HTML .board element
      var reset = jQuery("#reset");
      var resetModal = jQuery(".closeAndReset");
      var boardWidth = board.width(); // the maximum X-Coordinate of the screen
      var boardHeight = jQuery(window).height();
      // update the boardWidth variable when the window is resized
      jQuery(window).on("resize", function () {
        boardWidth = board.width();
      });

      // Every 50 milliseconds, call the update Function (see below)
      // setInterval(update, 50);
      var interval = setInterval(update, 50);
      // var interval = setInterval(update, 50);

      // Every time the box is clicked, call the handleBoxClick Function (see below)
      box.on("click", handleBoxClick);
      board.on("click", boardClick);

      reset.on("click", resetGame1);
      resetModal.on("click", resetGame1);

      // moves the Box to a new position on the screen along the X-Axis
      function moveBoxTo(newPositionX, newPositionY) {
        box.css("left", newPositionX);
        box.css("top", newPositionY);
      }

      // changes the text displayed on the Box
      function changeBoxText(newText) {
        scoreBoard.text(newText);
      }

      // Endgame function

      const popup = document.getElementById('endGameModal');
      const popupMessage = document.getElementById('endGameMessage');
      const resetGame = document.getElementById('closeAndReset');

      function endGame(outcome) {
        clearInterval(interval);
        switch (outcome) {
          case 'win':
            popupMessage.textContent = "You Win!";
            popup.style.display = "block";
            break;
          case 'lose':
            popupMessage.textContent = "You Lose!"
            popup.style.display = "block";
            break;
          case 'reset':
            popup.style.display = "none";
            console.log("error in endGame function");
            positionX = 0;
            positionY = 0;
            points = 0;
            strikes = 0;
            speedX = 10;
            speedY = 10;

            changeBoxText(points);
            moveBoxTo(positionX, positionY);

            interval = setInterval(update, 50);
            break;
          default:
            alert("Error in code!");
        }
      }

      //////////////////////////////////////////////////////////////////
      /////////////////// YOUR CODE BELOW HERE /////////////////////////
      //////////////////////////////////////////////////////////////////

      // TODO 2 - Variable declarations

      var positionX = 0;
      var positionY = 0;
      var points = 0;
      var strikes = 0;
      var speedX = 10;
      var speedY = 10;
      var speedMult = 3;
      var cinnaUpRight = "url('imagesB/cinnaPlane/CinnaUpRight.png')";
      var cinnaDownRight = "url('imagesB/cinnaPlane/CinnaDownRight.png')";
      var cinnaUpLeft = "url('imagesB/cinnaPlane/CinnaUpLeft.png')";
      var cinnaDownLeft = "url('imagesB/cinnaPlane/CinnaDownLeft.png')";

      /**
       * This Function will be called 20 times/second.
       * Each time it is called, it should move the Box to a new location.
       * If the box drifts off the screen, turn it around!
       */
      function update() {

        positionX += speedX;
        positionY += speedY;
        if (positionX > boardWidth || positionX < 0) {
          speedX *= -1;
        }
        if (positionY > boardHeight || positionY < 0) {
          speedY *= -1;
        }
        moveBoxTo(positionX, positionY);

        if (speedX > 0 && speedY < 0) {
          box.css("background-image", cinnaUpRight)
        } else if (speedX > 0 && speedY > 0) {
          box.css("background-image", cinnaDownRight)
        } else if (speedX < 0 && speedY < 0) {
          box.css("background-image", cinnaUpLeft)
        } else if (speedX < 0 && speedY > 0) {
          box.css("background-image", cinnaDownLeft)
        }
      }

      /**
       * This Function will be called each time the box is clicked.
       * Each time it is called, it should perform each of the following actions:
       * - increase the points total
       * - increase the speed
       * - move the box to the left side of the screen.
       */
      function handleBoxClick() {
        var randNumX = Math.random() * boardWidth;
        var randNumY = Math.random() * boardHeight;
        positionX = randNumX;
        positionY = randNumY;
        points++;
        changeBoxText(points);

        if (points % 3 === 0) {
          speedX = points * speedMult + 10;
          speedY = points * speedMult + 10;
        }

        if (points === 10) {
          endGame('win');
        }
      }

      function boardClick() {
        strikes++;

        if (strikes === 10) {
          endGame('lose');
        }
      }
      function resetGame1() {
        endGame('reset')
      }



    })();
  </script>
</body>

</html>
