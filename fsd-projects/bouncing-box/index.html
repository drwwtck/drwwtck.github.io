<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Bouncing Box</title>
  <script src="jquery.min.js"></script>
  <!-- FONTS EMBED BELOW -->
 
  <!-- FONTS ENBED ABOVE -->
  <style>
    /* FONTS EMBED BELOW */
    
    /* FONTS EMBED ABOVE */
    .box {
      background-image: url("imagesB/cinnaPlane.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      width: 70px;
      height: 70px;
      font-size: 300%;
      text-align: center;
      user-select: none;
      display: block;
      position: absolute;
      top: 100px;
      /* Change me! */
      left: 0px;
    }
    .board {
      height: 100vh;
      background-color: rgb(169, 235, 255);
    }
    .scoreBoard {
      height: 100px;
      width: 200px;
      left: 5px;
      top: 5px;
      background-image: url("imagesB/scoreBoard.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      color: rgb(0, 175, 219);
      font-size: 30px;
      place-content: center;
      text-align: center;
      margin: 5;
      position: fixed;
      /* padding: 15px; */
    }
    #reset {
      height: 100px;
      width: 100px;
      background-image: url("imagesB/resetButton.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      right: 5px;
      top: 5px;
      position: fixed;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgb(0, 0, 0);
      background-color: rgba(0, 0, 0, 0.4);
    }

    .modalContent {
      background-color: rgb(164, 255, 255);
      color: rgb(0, 173, 241);
      margin: 15% auto;
      text-align: center;
      padding: 20px;
      border: 1px solid;
      border-color: white;
      width: 80%;
    }

    .closeAndReset {
      color: white;
      float: right;
      font-size: 28px;
      font-weight: bold;
    }

    .closeAndReset:hover,
    .closeAndReset:focus {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
  <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
</head>

<body class="board">
  <!-- HTML for the box -->
  <div class="box"></div>
  <div class="scoreBoard">0</div>
  <div id=reset></div>

  <!-- Modal Popups: https://www.w3schools.com/howto/howto_css_modals.asp -->

  <div id="endGameModal" class="modal">
    <div class="modalContent">
      <span class="closeAndReset">&times;</span>
      <h2 id="endGameMessage">error</h2>
    </div>
  </div>

  <div id="startMenu" class="modal">
    <div class="modalConent">
      <h2>Welcome! Select a difficulty!</h2>
      <img src="fsd-projects/bouncing-box/imagesB/startMenu/easy.png" id="easyBtn">
      <img src="fsd-projects/bouncing-box/imagesB/startMenu/medium.png" id="normalBtn">
      <img src="fsd-projects/bouncing-box/imagesB/startMenu/hard.png*/" id="hardBtn">
    </div>
  </div>

  <script>
    (function () {
      "use strict";
      /* global jQuery */

      /////////////////////////// ///////////////////////////////////////
      /////////////////// SETUP DO NOT DELETE //////////////////////////
      //////////////////////////////////////////////////////////////////

      //start menu//

      const startMenu = jQuery("#startMenu");
      const easyBtn = jQuery("#easyBtn");
      const normalBtn = jQuery("#normalBtn");
      const hardBtn = jQuery("#hardBtn");

      //end of start menu//

      const box = jQuery(".box"); // reference to the HTML .box element
      const scoreBoard = jQuery(".scoreBoard")
      const board = jQuery(".board"); // reference to the HTML .board element
      const reset = jQuery("#reset");
      const resetModal = jQuery(".closeAndReset");
      const boardWidth = board.width(); // the maximum X-Coordinate of the screen
      const boardHeight = jQuery(window).height();
      // update the boardWidth variable when the window is resized
      jQuery(window).on("resize", function () {
        boardWidth = board.width();
      });

      // Every 50 milliseconds, call the update Function (see below)
      // setInterval(update, 50);
      let interval = setInterval(update, 50)

      // Every time the box is clicked, call the handleBoxClick Function (see below)
      box.on("click", handleBoxClick);
      board.on("click", boardClick);

      reset.on("click", resetGame1);
      resetModal.on("click", resetGame1);

      // moves the Box to a new position on the screen along the X-Axis
      function moveBoxTo(newPositionX, newPositionY) {
        box.css("left", newPositionX);
        box.css("top", newPositionY);
      }

      // changes the text displayed on the Box
      function changeBoxText(newText) {
        scoreBoard.text(newText);
      }

      // Start Menu

      const openMenu = document.getElementById('startMenu')

      /* 
      Pseudo Code:

      At start.. when window is opened 'openMenu.style.display = "block";' needs to be executed...

      The menu must be styled to be pretty.

      When happy face is clicked... easy presets should be set

      When sleeping face is clicked... medium/normal presets should be set

      When angry face is clicked... hard presets should be clicked

      !!WITHIN THE END GAME MODEL!!
        &times should lead back to the starting menu and so should the reset button... they are connected so it should change at the same time.
      
      Once all of the above is completed... clean up code:
        - endGame function declaration should be changed to a conditional because it is not a loop so "switch" "case" "break;" is major overkill.
        - check for scope errors... when in doubt try using modern keywords like "const" and "let"
        - could an array be added?
            if used...create a comment to explained why it was used
        - could a loop be added? If so what kind?
            For | While | Do While | .forEach method | for...of | for...in 
            if used...create a comment to explained why it was used
      !!REMEMBER!!
      If stuck... search on w3 schools or ask ms. waters
      DRY
      use concatenation for simple string construction... use template literals for more complex string construction
      */

      // Endgame function

      const popup = document.getElementById('endGameModal');
      const popupMessage = document.getElementById('endGameMessage');
      const resetGame = document.getElementById('closeAndReset');

      function endGame(outcome) {
        clearInterval(interval);
        switch (outcome) {
          case 'win':
            popupMessage.textContent = "You Win!";
            popup.style.display = "block";
            break;
          case 'lose':
            popupMessage.textContent = "You Lose!"
            popup.style.display = "block";
            break;
          case 'reset':
            popup.style.display = "none";
            console.log("error in endGame function");
            positionX = 0;
            positionY = 0;
            points = 0;
            strikes = 0;
            speedX = 10;
            speedY = 10;

            changeBoxText(points);
            moveBoxTo(positionX, positionY);

            interval = setInterval(update, 50);
            break;
          default:
            alert("Error in code!");
        }
      }

      //////////////////////////////////////////////////////////////////
      /////////////////// YOUR CODE BELOW HERE /////////////////////////
      //////////////////////////////////////////////////////////////////

      // TODO 2 - Variable declarations

      let positionX = 0;
      let positionY = 0;
      let points = 0;
      let strikes = 0;
      let speedX = 10;
      let speedY = 10;
      let speedMult = 3;
    
      const cinnaUpRight = "url('imagesB/cinnaPlane/CinnaUpRight.png')";
      const cinnaDownRight = "url('imagesB/cinnaPlane/CinnaDownRight.png')";
      const cinnaUpLeft = "url('imagesB/cinnaPlane/CinnaUpLeft.png')";
      const cinnaDownLeft = "url('imagesB/cinnaPlane/CinnaDownLeft.png')";

      /**
       * This Function will be called 20 times/second.
       * Each time it is called, it should move the Box to a new location.
       * If the box drifts off the screen, turn it around!
       */
      function update() {

        positionX += speedX;
        positionY += speedY;
        if (positionX > boardWidth || positionX < 0) {
          speedX *= -1;
        }
        if (positionY > boardHeight || positionY < 0) {
          speedY *= -1;
        }
        moveBoxTo(positionX, positionY);

        if (speedX > 0 && speedY < 0) {
          box.css("background-image", cinnaUpRight)
        } else if (speedX > 0 && speedY > 0) {
          box.css("background-image", cinnaDownRight)
        } else if (speedX < 0 && speedY < 0) {
          box.css("background-image", cinnaUpLeft)
        } else if (speedX < 0 && speedY > 0) {
          box.css("background-image", cinnaDownLeft)
        }
      }

      /**
       * This Function will be called each time the box is clicked.
       * Each time it is called, it should perform each of the following actions:
       * - increase the points total
       * - increase the speed
       * - move the box to the left side of the screen.
       */
      function handleBoxClick() {
        let randNumX = Math.random() * boardWidth;
        let randNumY = Math.random() * boardHeight;
        positionX = randNumX;
        positionY = randNumY;
        points++;
        changeBoxText(points);

        if (points % 3 === 0) {
          speedX = points * speedMult + 10;
          speedY = points * speedMult + 10;
        }

        if (points === 10) {
          endGame('win');
        }
      }

      function boardClick() {
        strikes++;

        if (strikes === 10) {
          endGame('lose');
        }
      }
      function resetGame1() {
        endGame('reset')
      }



    })();
  </script>
</body>

</html>
